<script type="text/javascript">
@WIZRPL(LEFT=350);
@WIZRPL(TOP=200);
@WIZRPL(HEIGHT=475);
@WIZRPL(WIDTH=350);
@WIZRPL(FORM=REASON);
@WIZRPL(STYLE=HTM);
@WIZRPL(STATE=STAYONTOP);
@WIZRPL(OPTIONS=BS1BI0);
@WIZRPL(TITLE=RETURN);

@IF(@DBHOT(SAL_HDR,F1067)&lt;&gt;@STORE@TER)
	@DBHOT(HOT_WIZ,PARAMTOLINE,PARAMSAV_RETURN)
	@WIZRPL(HOOKSKIP=ERROR)
	@EXEC(FCT=30);
	@EXEC(FCT=305);
	@EXEC(FCT=650);
	@WIZCLR(HOOKSKIP);
	@WIZRESET;
	@DBHOT(HOT_WIZ,LINETOPARAM,PARAMSAV_RETURN)
	@DBHOT(HOT_WIZ,CLR,PARAMSAV_RETURN)
@ENDIF



@wizset(CP=5)
var sMandatoryFields = 'SAL_HDR[F1149],SAL_HDR[F1150],SAL_HDR[F1156],SAL_HDR[F1172],REASON_CODE';
  
function SmsLoad() 
{
  VariableInit('@dbHot(DBALIAS)','@DBHOT(DBUSERNAME)','@DBHOT(DBPASSWORD)','Http:/Scripts/trs.exe');
  SetMandatoryFlag();
  top.BodyLoad(document);
  top.CursorSetFocus(document,"@wizget(CS)","@wizget(CP)");
}

function SetMandatoryFlag()
{
  var TagDesc;
  for (var x=1; x<DataTable.rows.length+1; x++){
		TagDesc=document.getElementById(x+'Tag').innerHTML;
		if(sMandatoryFields.indexOf(document.getElementById(x).name)>-1)
			document.getElementById(x+'Tag').innerHTML=TagDesc+' *';
	}
}

function ClearAll()
{
    //************************** clear the field background color **************************
  for (var x=1; x<DataTable.rows.length+1; x++){
    top.EntSetHighLight(document.getElementById(x),0,'EntErr');
	document.getElementById(x).value='';
	}
}

function SubmitForm()
{
    var sMsgErr='';

  for (var x=1; x<DataTable.rows.length+1; x++)
  {
    //************************** clear the field background color **************************
    top.EntSetHighLight(document.getElementById(x),0,'EntErr');
	
	//******************** Remove special characters from fields ***************************************
	var sValue = document.getElementById(x).value;
	sValue=sValue.replace(/["']/g, " ");
	sValue=sValue.replace(/[(]/g, "[");
	sValue=sValue.replace(/[)]/g, "]");
	document.getElementById(x).value = sValue;
    //******************** Don't submit if madatory fields are missing *********************
    if(sMandatoryFields.indexOf(document.getElementById(x).name)>-1 && document.getElementById(x).value=='')
    {
        top.EntSetHighLight(document.getElementById(x),1,'EntErr');
        sMsgErr='Missing mandatory fields \n';
    }
  } 
  if(sMsgErr!=''){
    alert('Cannot submit values because:\n\n'+sMsgErr);
	return false;
	}
	document.getElementById('Entry').value=document.getElementById('REASON_CODE').value;
	return true;
}

</script>
<style type="text/css">
input.EntErr,select.EntErr,textarea.EntErr {
    background-color: red;
    }
</style>
  </head>

  <body class="InfoHdr" onselectstart="document.selection.empty();" onkeydown="if(event.keyCode==27)document.location='Http:/Scripts/trs.exe?btn=close&FORM=@WIZGET(FORM)&FCT=30'" onload="SmsLoad()">

    </div>

    </object>

			<td class="HdrBtnCel"><input class="HdrBtnNew" datasrc="@ATTRIB(B)" onclick="ClearAll();return false" type="submit" value="Clear" name="BTNCLEAR" /></td>

				 </tr>

				  <td class="EntVal"><input id="2" class="EntTxt" style="WIDTH: 220px" datasrc="@ATTRIB(E0F:txt,'NOREFRESH')" size="32" name="SAL_HDR[F1150]" value="@DBHOT(SAL_HDR,F1150,L)"/> </td>
				 </tr>

				 </tr>
				<tr>

				</tr>
				 <tr>

			  	  <td class="EntVal"><input id="7" class="EntValTxt" style="WIDTH: 220px" readonly="readonly" tabindex="-1" size="32" name="Cashier" value="@DBHOT(SAL_HDR,F1127)"/> </td>

				 <tr>

			  	  <td class="EntVal"><input id="8" class="EntValTxt" style="WIDTH: 220px" readonly="readonly" tabindex="-1" size="32" name="Username" value="@USERNAME"/> </td>
				 </tr>
                </tbody>

            </td>
