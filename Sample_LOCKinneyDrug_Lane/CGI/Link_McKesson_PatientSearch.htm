function CloseForm(sAction,sUrl)
{
  if(sAction == 'Cancel')
  {
   document.location='Http:/Scripts/trs.exe?btn=close&FORM=@WIZGET(FORM)&BTNSUBMIT=CANCEL';
   return false;
  }
  else
   return true;
}

function ChooseFilter(sFilterType)
{
	if(sFilterType=="PhoneFilter")
		{
		document.getElementById("PhoneRow").style.display="";
		document.getElementById("FirstNameRow").style.display="none";
		document.getElementById("LastNameRow").style.display="none";
		document.getElementById("DOBRow").style.display="none";
		document.getElementById("StateRow").style.display="none";
		document.getElementById("ZipRow").style.display="none";
		document.getElementById("FirstName").tabIndex="-1";
		document.getElementById("LastName").tabIndex="-1";
		document.getElementById("DateOfBirth").tabIndex="-1";
		document.getElementById("TState").tabIndex="-1";
		document.getElementById("Zip").tabIndex="-1";
		}
	if(sFilterType=="LastNamePlusFilter")
		{
		document.getElementById("PhoneRow").style.display="";
		document.getElementById("FirstNameRow").style.display="";
		document.getElementById("LastNameRow").style.display="";
		document.getElementById("DOBRow").style.display="";
		document.getElementById("StateRow").style.display="";
		document.getElementById("ZipRow").style.display="";
		document.getElementById("FirstName").tabIndex="";
		document.getElementById("LastName").tabIndex="";
		document.getElementById("DateOfBirth").tabIndex="";
		document.getElementById("TState").tabIndex="";
		document.getElementById("Zip").tabIndex="";
		}
	document.getElementById("FilterType").value=sFilterType;
}

function SubmitForm()
{
    var sMsgErr='';
	var sFirstName=document.getElementById("FirstName").value;
	var sLastName=document.getElementById("LastName").value;
	var sDateOfBirth=document.getElementById("DateOfBirth").value;
	var sPhoneNumber=document.getElementById("PhoneNumber").value;	
	var TState=document.getElementById("TState").value;	
	var sZip=document.getElementById("Zip").value;	
	var sFilterType;
	
// Phone filter (must be 10 digit number)
  if(document.getElementById("FilterType").value=='PhoneFilter')
  {
  if(sPhoneNumber.length!=10)
    sMsgErr+='Phone number must be 10 digits\n';  
  document.getElementById("FirstNameRow").value="";
  document.getElementById("LastNameRow").value="";
  document.getElementById("DOBRow").value="";
  document.getElementById("StateRow").value="";
  document.getElementById("ZipRow").value="";
  }
  else
  {
  var iReq=0;
  if(sLastName.length==0)
    sMsgErr+='Last name is mandatory\n';    
  if(sLastName.length<3)
    sMsgErr+='Last name too short\n';  
  if(sFirstName.length<3 && sFirstName.length!==0)
    sMsgErr+='First name too short\n';
  if(sPhoneNumber.length!==10 && sPhoneNumber.length!==0)
    sMsgErr+='Phone number must be 10 digits\n';
  if(sDateOfBirth.length!==8 && sDateOfBirth.length!==0)
    sMsgErr+='Date of Birth must be entered as MMDDYYYY\n';   
  else if(sDateOfBirth.length!==0 && !validateDate(sDateOfBirth))
    sMsgErr+='Date of Birth must be entered as MMDDYYYY\n'; 
  else if(sDateOfBirth.length!==0)iReq+=1
  if(TState.length!==0)iReq+=1
  if(sZip.length!==0)iReq+=1
  if(iReq==0)
   sMsgErr+='Last name lookup should contain at least one of the following:\n-date of birth\n-state\n-zip code';
   }
	
  if(sMsgErr!=''){
    alert('Cannot submit values because:\n\n'+sMsgErr);
	return false;
	}
	return true;
}

// Validate date of birth
function validateDate(inputText)
{
   // Extract the string into month, date and year
   var mm = parseInt(inputText.substring(0,2),10);
   var dd = parseInt(inputText.substring(2,4),10);
   var yyyy = parseInt(inputText.substring(4,8),10);

   // Create list of days of a month [assume there is no leap year by default]
   var ListofDays = [31,28,31,30,31,30,31,31,30,31,30,31];

   if (dd==0)
      return false;

   // Check all months except for February
   if (mm==1 || mm>2)
   {
      if (dd>ListofDays[mm-1])
         return false;
      else
         if (yyyy < 1900)
            return false;
         else
            return true;
   }

   // Check February and check for Leap Year
   if (mm==2)
   {
      var lyear = false;
      if ( (!(yyyy % 4) && yyyy % 100) || !(yyyy % 400)) 
         lyear = true;

       if ((lyear==false) && (dd>=29))
         return false;
      else
         if (yyyy < 1900)
            return false;
         else
            if (yyyy < 1900)
               return false;
            else
               return true;

      if ((lyear==true) && (dd>29))
         return false;
      else
         if (yyyy < 1900)
            return false;
         else
            return true;
   }
}
