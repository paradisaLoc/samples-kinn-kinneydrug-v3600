<script type="text/javascript">
@wizset(CP=4)
function SmsLoad() 
{
  top.BodyLoad(document);
  top.CursorSetFocus(document,"@wizget(CS)","@wizget(CP)");
  VariableInit('@dbHot(DBALIAS)','@DBHOT(DBUSERNAME)','@DBHOT(DBPASSWORD)','Http:/Scripts/trs.exe');
}

function LocalKey()
{
  if(window.event.keyCode==27)
    document.all("CLOSE").click();
}

function formClicked(btnClicked)
{
  document.getElementById("FORM_CLICKED").value = btnClicked;
}

function SubmitForm()
{
  if (document.getElementById("FORM_CLICKED").value!="DOB" && document.getElementById("FORM_CLICKED").value!="" )
  {
    return true;
  }
  else
  {
    var sMsgErr='';
    var sDateOfBirth=document.getElementById("FORM_DOB").value;
	
    if(sDateOfBirth.length!==4 || !validateDate(sDateOfBirth))
      sMsgErr='Date of Birth must be entered as MMDD\n';   

    if(sMsgErr!='')
    {
      alert(sMsgErr);
      return false;
    }
    else
      return true;
  }
}

// Validate date of birth
function validateDate(inputText)
{
   // Extract the string into month and date
   var mm = parseInt(inputText.substring(0,2),10);
   var dd = parseInt(inputText.substring(2,4),10);

   // Create list of days of a month
   var ListofDays = [31,29,31,30,31,30,31,31,30,31,30,31];

   if (dd==0)
      return false;

   // Verify that number of days in the month 
   if (mm>=1 && mm<=12)
   {
     if (dd>ListofDays[mm-1])
       return false;
     else
       return true;
   }
   else
     return false;
}
</script>
  </head>
