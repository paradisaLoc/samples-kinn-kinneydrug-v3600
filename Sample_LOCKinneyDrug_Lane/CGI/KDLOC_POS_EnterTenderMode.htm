@wizSet(WIDTH=600);
@wizSet(HEIGHT=550);
@wizRpl(STATE=STAYONTOP);
@wizRpl(FORM=HINTAAA);
@wizRpl(TITLE=Card entry reminder);
@wizRpl(OPTIONS=BS1BI0);

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>trs_pos_edit_itm</title>
    <meta name="CurHdr" content="ScreenPos" />
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <link rel="stylesheet" href="../../Images/pos_entry.css" type="text/css" />
<script src="../../Images/sms.js" type="text/javascript">
</script>
<script type="text/javascript">
function SmsLoad() 
{
  top.BodyLoad(document);
  top.CursorSetFocus(document,"@wizget(CS)","2");
}

function FormClose()
{
  document.location= 'http:/scripts/trs.exe?BTN=CLOSE&CN=@CNC';
}

function go(url)
{
  document.location='http:/scripts/trs.exe?'+url+'&CN=@CNC&TN=@TER';
}

function num(txt)
{
  if (txt=='B')
    ENTRY.value=ENTRY.value.substring(0,ENTRY.value.length-1);
  else if (txt=='C')
    ENTRY.value='';
  else
    ENTRY.value=ENTRY.value+txt;
}

</script>
  </head>

  <body class="InfoHdr" onselectstart="document.selection.empty();" onkeydown="if(event.keyCode==27)CANCEL.click()" onload="SmsLoad()">

    <object id="comdialog" style="VISIBILITY: hidden; POSITION: absolute; TOP: -200px" height="10" width="100" classid="clsid:327DC737-2BAD-48A3-9B4E-B42D5378C78A">
    </object> 

    <table class="HdrTab">
      <tbody>
        <tr>
          <td class="HdrCel">LOYALTY CARD ENTRY</td>

          <td class="HdrBtnCel"><input class="HdrBtnNew" style="WIDTH: 80px" datasrc="@ATTRIB(B)" onclick="FormClose()" type="button" value="Close" name="CANCEL" /></td>
        </tr>
      </tbody>
    </table>

    <table class="FrmTab" style="margin-top:20px">
      <tbody>
        <tr>
          <td class="FrmCel">
            <table class="EntTab">
              <tbody>
                <tr>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:240px;HEIGHT:80px;margin:5px 0px 20px 0px" datasrc="@ATTRIB(B)" value="No card, continue with sub-total" onclick="FormClose();go('SQI=KDLOC_POS_EnterTenderMode&KDLOC.CUSTPROMPT=0')" /></td>
                </tr>

                <tr>
                  <td class="EntHdr">Scan or Enter card and click OK</td>
                </tr>

                <tr>
                  <td class="EntInp"><input class="EntTxt" style="WIDTH: 160px" datasrc="@attrib(E_A:txt,'NOREFRESH')" size="4" value="" name="ENTRY" /></td>
                </tr>
              </tbody>
            </table>
          </td>
          <td class="FrmCel">
            &nbsp;&nbsp;
          </td>
          <td class="FrmCel">
            <table class="EntTab">
              <tbody>

                <tr>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="Clear" onclick="num('C')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="Back" onclick="num('B')"  ondblclick="num('B')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="OK" onclick="FormClose();go('FCT=908&ENTRY='+ENTRY.value);" /></td>
                </tr>

                <tr>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="7" onclick="num('7')" ondblclick="num('7')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="8" onclick="num('8')" ondblclick="num('8')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="9" onclick="num('9')" ondblclick="num('9')" /></td>
                </tr>

                <tr>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="4" onclick="num('4')" ondblclick="num('4')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="5" onclick="num('5')" ondblclick="num('5')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="6" onclick="num('6')" ondblclick="num('6')" /></td>
                </tr>

                <tr>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="1" onclick="num('1')" ondblclick="num('1')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="2" onclick="num('2')" ondblclick="num('2')" /></td>
                  <td class="EntInp"><input type="button" class="EntBtn" style="WIDTH:80px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="3" onclick="num('3')" ondblclick="num('3')" /></td>
                </tr>

                <tr>
                  <td class="EntInp" colspan="3"><input type="button" class="EntBtn" style="WIDTH:165px;HEIGHT:80px;margin:2px" datasrc="@ATTRIB(B)" value="0" onclick="num('0')" ondblclick="num('0')" /></td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>

    <table class="FrmTab" style="margin-top:10px">
      <tbody>
        <tr>
          <td class="FrmCel">
          </td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
