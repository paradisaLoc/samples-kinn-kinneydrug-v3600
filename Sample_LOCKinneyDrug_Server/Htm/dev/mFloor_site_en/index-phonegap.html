<!DOCTYPE HTML>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">

	<script type="text/javascript">
		var appServerSms = 'http://demo.locsoftware.com';
		var appServerResources = 'http://demo.locsoftware.com/Bitmaps/';
		var appServerWebsocket = '';
		var appDeviceName = '';
		var appServerLanguage = 'EN';
	</script>

	<title>LOC Software mFloor</title>

	<style type="text/css">
		/**
		* Example of an initial loading indicator.
		* It is recommended to keep this as minimal as possible to provide instant feedback
		* while other resources are still being loaded for the first time
		*/
		html, body {
		height: 100%;
		background-color: #000
		}
		
		#appLoadingIndicator {
		position: absolute;
		top: 50%;
		margin-top: -15px;
		text-align: center;
		color: #fff;
		width: 100%;
		height: 30px;
		-webkit-animation-name: appLoadingIndicator;
		-webkit-animation-duration: 0.7s;
		-webkit-animation-iteration-count: infinite;
		-webkit-animation-direction: linear;
		}
		
		#appLoadingIndicator > div {
		background-color: #c0c0c0;
		display: inline-block;
		height: 30px;
		-webkit-border-radius: 15px;
		margin: 0 5px;
		width: 30px;
		opacity: 0.8;
		}
		
		@-webkit-keyframes appLoadingIndicator{
		0% {
		opacity: 0.8
		}
		50% {
		opacity: 0
		}
		100% {
		opacity: 0.8
		}
		}
	</style>
	
	<!-- The line below must be kept intact for Sencha Command to build your application -->
	<script id="microloader" type="text/javascript" src=".sencha/app/microloader/development.js"></script>
</head>

<body>
	<div id="appLoadingIndicator">
		<p style="margin-bottom:15px">Loading</p>
		<div></div>
		<div></div>
		<div></div>
	</div>
</body>
</html>
